<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel — Minhas Tarefas</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

  :root{
    --bg: #1B1F3B;
    --bg-deep: #12152B;
    --surface: #242850;
    --surface-2: #2E3364;
    --amber: #F5A623;
    --amber-soft: #FFD08A;
    --mint: #6FCF97;
    --text: #F3F1EA;
    --text-muted: #9296B8;
    --line: rgba(243,241,234,0.10);
  }

  *{
    box-sizing: border-box;
  }

  html, body{
    margin: 0;
    height: 100%;
  }

  body{
    font-family: 'Inter', sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(245,166,35,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(111,207,151,0.08), transparent 45%),
      linear-gradient(180deg, var(--bg-deep), var(--bg));
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  .dashboard{
    width: 100%;
    max-width: 460px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 40px 36px 36px;
    box-shadow: 0 30px 60px -25px rgba(0,0,0,0.55);
    position: relative;
    overflow: hidden;
  }

  .dashboard::before{
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--amber), var(--mint));
  }

  .tab{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 22px;
  }

  .tab span.dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 0 4px rgba(111,207,151,0.15);
  }

  .hero{
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
  }

  .checkbox{
    flex-shrink: 0;
    width: 58px;
    height: 58px;
    border-radius: 14px;
    background: var(--surface-2);
    border: 2px solid var(--amber-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .checkbox svg{
    width: 30px;
    height: 30px;
  }

  .checkbox path{
    fill: none;
    stroke: var(--mint);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 40;
    stroke-dashoffset: 40;
    animation: risca 0.6s 0.5s ease forwards;
  }

  @keyframes risca{
    to{
      stroke-dashoffset: 0;
    }
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.15;
    margin: 0 0 6px;
  }

  .hero p{
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
  }

  .stats{
    display: flex;
    gap: 12px;
    margin-bottom: 30px;
  }

  .stat{
    flex: 1;
    background: var(--bg-deep);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
  }

  .stat strong{
    display: block;
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
  }

  .stat span{
    font-size: 12px;
    color: var(--text-muted);
  }

  .stat.pendentes strong{
    color: var(--amber);
  }

  .stat.feitas strong{
    color: var(--mint);
  }

  .actions{
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  button{
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    padding: 15px 22px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  button:focus-visible{
    outline: 2px solid var(--amber-soft);
    outline-offset: 3px;
  }

  .btn-primary{
    background: linear-gradient(135deg, var(--amber), #E08E1A);
    color: #22190A;
    box-shadow: 0 12px 24px -10px rgba(245,166,35,0.55);
  }

  .btn-primary:hover{
    transform: translateY(-2px);
    box-shadow: 0 16px 28px -10px rgba(245,166,35,0.65);
  }

  .btn-secondary{
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--line);
  }

  .btn-secondary:hover{
    color: var(--text);
    border-color: rgba(243,241,234,0.28);
    background: rgba(243,241,234,0.04);
  }

  @media (prefers-reduced-motion: reduce){

    .checkbox path{
      animation: none;
      stroke-dashoffset: 0;
    }

    button{
      transition: none;
    }

  }

  @media (max-width: 480px){

    .dashboard{
      padding: 32px 24px 28px;
    }

    h1{
      font-size: 26px;
    }

  }

</style>

</head>

<body>

  <main class="dashboard">

    <div class="tab">

      <span class="dot"></span>

      Painel de tarefas

    </div>

    <div class="hero">

      <div class="checkbox">

        <svg viewBox="0 0 24 24">

          <path d="M4 12l5 5L20 6"></path>

        </svg>

      </div>

      <div>

        <h1>Olá, vamos organizar seu dia?</h1>

        <p>Suas tarefas de hoje estão te esperando.</p>

      </div>

    </div>

    <div class="stats">

      <div class="stat pendentes">

        <strong id="pending-count">0</strong>

        <span>pendentes</span>

      </div>

      <div class="stat feitas">

        <strong id="completed-count">0</strong>

        <span>concluídas</span>

      </div>

    </div>

    <div class="actions">

      <a href="/tasks.html">

        <button class="btn-primary" type="button">

          Ver tarefas

        </button>

      </a>

      <button class="btn-secondary" type="button" onclick="sair()">

        Sair

      </button>

    </div>

  </main>

  <script>

    async function atualizarContadores() {

      try {

        const response = await fetch("/tasks");

        if (!response.ok) {

          throw new Error("Erro ao buscar tarefas");

        }

        const tarefas = await response.json();

        let pendentes = 0;

        let concluidas = 0;

        tarefas.forEach(tarefa => {

          if (tarefa.feito) {

            concluidas++;

          } else {

            pendentes++;

          }

        });

        document.getElementById("pending-count").textContent = pendentes;

        document.getElementById("completed-count").textContent = concluidas;

      } catch (error) {

        console.error("Erro ao atualizar contadores:", error);

      }

    }

    async function sair() {

      try {

        await fetch("/shutdown", {
          method: "POST"
        });

        window.close();

      } catch (error) {

        console.error("Erro ao finalizar o programa:", error);

      }

    }

    atualizarContadores();

  </script>

</body>

</html>
